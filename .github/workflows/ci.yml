name: replaygate-ci

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lint (ruff)
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff
          ruff check replaygate-platform --exit-zero

      - name: Unit tests
        run: |
          python -m pip install pytest
          pytest -q || true

      - name: Docker compose up
        run: docker compose up -d --build

      - name: Demo run (replay+perf)
        run: |
          pwsh -ExecutionPolicy Bypass -File scripts/demo.ps1 -Runners replay,perf

      - name: Collect artifacts
        uses: actions/upload-artifact@v4
        with:
          name: replaygate-artifacts
          path: artifacts

  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker compose up
        run: docker compose up -d --build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt

      - name: Run API tests
        run: pytest -q tests/api

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: replaygate-api-artifacts
          path: artifacts
